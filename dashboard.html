            <button onclick="Sair()" class="w-full flex items-center justify-center gap-2 px-4 py-3 mb-4 rounded-xl text-sm font-bold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-500/10 hover:bg-red-100 dark:hover:bg-red-500/20 transition-colors">
                <i class="fa-solid fa-sign-out-alt"></i>
                Sair da Conta
            </button>
            
            <script>
                async function Sair() {
                    if(window.supabaseClient) {
                        await window.supabaseClient.auth.signOut();
                    }
                    sessionStorage.removeItem('shopyump_auth');
                    window.location.href = '/index.html';
                }

                // Script para buscar os dados do usuário no Supabase e colocar no topo do menu
                async function carregarDadosMenu() {
                    if(!window.supabaseClient) return;
                    const { data: { user } } = await window.supabaseClient.auth.getUser();
                    if (user) {
                        // Busca o nome do metadata ou usa o início do email
                        const nome = user.user_metadata?.full_name || user.user_metadata?.nome || user.email.split('@')[0];
                        document.getElementById('menu-user-nome').textContent = nome;
                        document.getElementById('menu-user-email').textContent = user.email;
                        document.getElementById('menu-user-avatar').textContent = nome.charAt(0).toUpperCase();
                    }
                }
                // Executar quando a página carregar
                document.addEventListener('DOMContentLoaded', carregarDadosMenu);
            </script>
