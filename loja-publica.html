<header id="main-header" class="fixed top-0 left-0 right-0 z-50 px-5 mt-5 transition-all duration-500 ease-in-out transform">

        <!-- Botão de Pesquisa -->

<main id="app-root" class="min-h-[80vh] pb-24"></main>

<nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-xl border-t border-slate-100 pb-safe pt-3 px-6 pb-4 flex justify-between items-center shadow-[0_-10px_40px_rgba(0,0,0,0.03)] hidden">

    <button id="menu-btn-carrinho" onclick="navegarPara('carrinho')" class="flex flex-col items-center gap-1 transition-all text-slate-400">

            <i class="fas fa-shopping-cart text-xl"></i>

        </div>
        <span class="text-[9px] font-semibold tracking-wide mt-1">Carrinho</span>
    </button>
</nav>

<script src="/spa.js"></script>

<script>
let lastScrollY = window.scrollY;
const header = document.getElementById('main-header');

window.addEventListener('scroll', () => {
    if (header && header.classList.contains('pointer-events-none')) return;

    const currentScrollY = window.scrollY;
    
    if (Math.abs(currentScrollY - lastScrollY) > 10) {
        if (currentScrollY > lastScrollY && currentScrollY > 80) {
            header.classList.add('-translate-y-28');
        } else {
            header.classList.remove('-translate-y-28');
        }
        lastScrollY = currentScrollY;
    }
});
</script>

<div id="painel-pesquisa" class="fixed inset-0 bg-white z-[100] transform translate-y-full transition-transform duration-300">
    <div class="px-5 py-6 flex items-center gap-4 border-b border-slate-100">
